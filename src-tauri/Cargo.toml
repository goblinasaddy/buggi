[package]
name = "buggi"
version = "1.0.0"
description = "Buggi Autonomous Bug Bounty Assistant"
authors = ["Buggi Development Team"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.5", features = ["api-all"] }

[features]
# default features enabled
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
